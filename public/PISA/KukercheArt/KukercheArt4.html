<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КукерчеАрт | KukercheArt</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description" content="fine digital test">
    <meta property="og:image" content="https://kitkazdravets.eu/favicon-256.png">
    <meta property="og:image:type" content="image/jpeg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://kitkazdravets.eu/favicon-256.png">
    <style>
        body {
            margin: 0;
        }

        main {
            margin: 0;
        }

        .left-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: calc(50vw - 250px);
            height: 100vh;
            animation: randomColorLeft 9s infinite alternate step-end;
        }

        .right-bg {
            position: fixed;
            top: 0;
            right: 0;
            width: calc(50vw - 250px);
            height: 100vh;
            animation: randomColorRight 6s infinite alternate step-end;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100vw;
            max-height: 100vh;
        }

        .center-image {
            position: relative;
            max-width: 100vh;
            max-height: 100vh;
            object-fit: cover;
            display: block;
        }

        .gif-overlay {
            position: absolute;
            bottom: 0;
            right: 0px;
            width: 30px;
            height: auto;
            pointer-events: none;
        }

        @keyframes randomColorLeft {
            0% {
                background-color: #1a0933;
            }

            15% {
                background-color: #0d2b22;
            }

            33% {
                background-color: #af08a6;
            }

            48% {
                background-color: #112233;
            }

            67% {
                background-color: #2e2608;
            }

            82% {
                background-color: #1f0a1d;
            }

            100% {
                background-color: #bcc90b;
            }
        }

        @keyframes randomColorRight {
            0% {
                background-color: #2b1a08;
            }

            20% {
                background-color: #0f1d3a;
            }

            38% {
                background-color: #2a082e;
            }

            55% {
                background-color: #3a3b3a;
            }

            73% {
                background-color: #380e14;
            }

            90% {
                background-color: #17282b;
            }

            100% {
                background-color: #242409;
            }
        }

        @media (max-width: 768px) {

            .image-wrapper,
            .center-image {
                width: 100vw;
                height: 100vw;
                max-width: none;
                max-height: none;
            }

            .left-bg {
                width: 100vw;
                height: calc(50vh - (85vw / 2));
                top: 0;
                left: 0;
            }

            .right-bg {
                width: 100vw;
                height: calc(50vh - (85vw / 2));
                bottom: 0;
                left: 0;
                top: auto;
                right: auto;
            }

            .gif-overlay {
                width: 20px;
                bottom: 0;
                right: 0;
            }
        }
    </style>
</head>

<body>


    <div class="left-bg"></div>
    <div class="right-bg"></div>

    <main style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="image-wrapper">
            <img src="KukercheArt4.jpeg" alt="КукерчеАрт | KukercheArt" class="center-image">
        </div>
    </main>

</body>

</html>
